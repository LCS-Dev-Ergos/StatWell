name: CI

on:
  push:
    branches:
      - main
      - lcs-code/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux build and runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate flake
        run: nix flake check --no-build
      - name: Build package and Home Manager activation
        run: |
          nix build .#statwell --no-link
          nix build .#checks.x86_64-linux.home-manager --no-link
      - name: Test Linux probes, CLI, daemon, and package providers
        run: nix develop .#ci --command make test PROFILE=debug
      - name: Test with AddressSanitizer and UndefinedBehaviorSanitizer
        run: nix develop .#ci --command make test PROFILE=asan
      - name: Test with GCC
        run: nix develop .#ci --command make test PROFILE=gcc

  macos:
    name: macOS package and Home Manager
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build package and Home Manager activation
        run: |
          nix build .#statwell --no-link
          nix build .#checks.aarch64-darwin.home-manager --no-link
      - name: Test macOS probes, CLI, daemon, and package providers
        run: nix develop .#ci --command make test PROFILE=debug
      - name: Test with AddressSanitizer and UndefinedBehaviorSanitizer
        run: nix develop .#ci --command make test PROFILE=asan
